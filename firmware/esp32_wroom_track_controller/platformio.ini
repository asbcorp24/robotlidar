[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Arduino-ESP32 defaults to GNU++11. Track uses aggregate initialization
; together with default member initializers, which requires GNU++14 or newer.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++14
  -D CORE_DEBUG_LEVEL=1

; GM009605 OLED 0.96" 128x64, SSD1306/SSD1315-compatible, I2C
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
