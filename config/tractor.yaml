motor_gpio_node:
  ros__parameters:
    # Оставить true, пока GPIO не подключены через безопасную развязку.
    dry_run: true
    active_high: true

    # Нумерация BCM, не физические номера контактов Raspberry Pi.
    left_forward_pin: 17
    left_reverse_pin: 27
    right_forward_pin: 22
    right_reverse_pin: 23

    # Расстояние между продольными центрами гусениц.
    track_width_m: 0.60
    wheel_command_deadband: 0.05
    command_timeout_sec: 0.50
    reverse_pause_sec: 0.35
    control_rate_hz: 50.0

hall_odometry_node:
  ros__parameters:
    dry_run: true
    left_hall_pin: 5
    right_hall_pin: 6
    hall_pull_up: true
    left_hall_inverted: false
    right_hall_inverted: false
    bounce_time_sec: 0.002

    # ВРЕМЕННЫЕ ЗНАЧЕНИЯ — заменить после измерений.
    pulses_per_motor_revolution: 6.0
    gear_ratio: 30.0
    drive_sprocket_circumference_m: 0.40
    track_width_m: 0.60

    publish_rate_hz: 30.0
    odom_frame: odom
    base_frame: base_link

    # TF odom->base_link публикует robot_localization.
    publish_tf: false

mpu6050_node:
  ros__parameters:
    # Поставить false после подключения и проверки I2C.
    dry_run: true
    i2c_bus: 1
    i2c_address: 104            # 0x68
    frame_id: imu_link
    publish_rate_hz: 50.0

    # Во время калибровки трактор должен быть полностью неподвижен.
    calibration_samples: 500
    calibration_sample_delay_sec: 0.01

    gyro_range_dps: 500
    accel_range_g: 4
    dlpf_cfg: 4

    # Изменить знаки, если модуль физически установлен другой стороной.
    axis_sign_x: 1.0
    axis_sign_y: 1.0
    axis_sign_z: 1.0

    angular_velocity_variance: 0.0025
    linear_acceleration_variance: 0.25

gps_node:
  ros__parameters:
    # UART NEO-6M: TXD GPS -> GPIO15/RXD (physical pin 10).
    port: /dev/ttyS0
    baudrate: 9600
    frame_id: gps_link
    odom_frame: odom
    wheel_odom_topic: /wheel/odom
    fix_topic: /gps/fix
    status_topic: /gps/status
    assist_odom_topic: /gps/odom
    assist_ready_topic: /gps/assist_ready

    # GPS — дополнительный источник. При плохом качестве /gps/odom не выходит.
    publish_assist_odom: true
    min_satellites: 4
    max_hdop: 4.0
    stale_timeout_sec: 3.0
    max_jump_m: 15.0
    max_plausible_speed_mps: 8.0

    # NEO-6M имеет метровую погрешность, поэтому влияние на EKF небольшое.
    position_sigma_floor_m: 2.5
    hdop_sigma_scale: 1.5

    # Для согласования GPS ENU с локальной системой odom робот должен проехать.
    alignment_distance_m: 5.0
    course_alignment_min_speed_mps: 0.8
    wheel_odom_max_age_sec: 2.0
    use_fixed_heading_offset: false
    fixed_heading_offset_deg: 0.0

    status_rate_hz: 2.0
    reconnect_interval_sec: 2.0

route_recorder_node:
  ros__parameters:
    route_file: ~/robotlidar_data/routes/cleaning_route.yaml
    map_frame: map
    base_frame: base_link
    sample_rate_hz: 5.0
    minimum_distance_m: 0.30
    minimum_heading_rad: 0.20
    auto_save_on_stop: true
    include_gps: true
    gps_topic: /gps/fix
    gps_max_age_sec: 3.0

route_player_node:
  ros__parameters:
    route_file: ~/robotlidar_data/routes/cleaning_route.yaml
    action_name: navigate_through_poses
    server_wait_timeout_sec: 3.0
    start_from_nearest_point: true
    robot_base_frame: base_link
    localization_timeout_sec: 3.0
    nearest_start_max_distance_m: 5.0
