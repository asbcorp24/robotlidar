[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Arduino-ESP32 defaults to GNU++11. Track uses aggregate initialization
; together with default member initializers, which requires GNU++14 or newer.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++14
  -D CORE_DEBUG_LEVEL=1

; SSD1315 OLED is initialized by the native U8g2 SSD1315 driver.
; Existing Adafruit_GFX framebuffer output is retained for the current UI.
; INA228 shares the physical GPIO4/GPIO23 bus at 100 kHz.
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit INA228 Library@^3.0.0
  olikraus/U8g2@^2.36.17
