ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.10
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Холлы дают поступательную и угловую скорость.
    odom0: /wheel/odom
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  false, false,
       false, false, true,
       false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # MPU6050 используется как второй источник угловой скорости Z.
    # Абсолютный yaw не используется: в MPU6050 нет магнитометра.
    imu0: /imu/data_raw
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_queue_size: 30
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false
